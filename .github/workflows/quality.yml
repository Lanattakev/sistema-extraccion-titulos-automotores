name: Backend quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / pypdf ${{ matrix.pypdf }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            pypdf: '6.20.1'
          - os: ubuntu-latest
            python: '3.13'
            pypdf: '7.0.0'
          - os: windows-latest
            python: '3.13'
            pypdf: '7.0.0'
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Create virtual environment
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt "pypdf==${{ matrix.pypdf }}"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pyright src/
      - run: python -X utf8 tests/test_architecture.py
      - run: python -X utf8 tests/test_clean_design.py --strict
      - run: python -X utf8 tests/test_god_components.py --strict
      - run: python -X utf8 -m pytest -q
