# Configuración de Pre-commit Hooks (Uncle Bob Constraint Gauntlet)
# Para instalar: pre-commit install
# Para ejecutar en todos los archivos: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: architecture-gauntlet
        name: El Guantelete de Restricciones (Architecture AST)
        entry: python tests/test_architecture.py
        language: system
        pass_filenames: false
        always_run: true

      - id: god-components-detector
        name: Detector de Componentes Dios (God Objects)
        entry: python tests/test_god_components.py --strict
        language: system
        pass_filenames: false
        always_run: true
      - id: clean-design-detector
        name: Detector de Código Muerto y Sobreingeniería (Clean Design & YAGNI)
        entry: python tests/test_clean_design.py --strict
        language: system
        pass_filenames: false
        always_run: true
